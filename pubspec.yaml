name: pocket_garden
description: "A local-first plant care companion. No account, no cloud, no internet."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_image_compress: ^2.5.1
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  freezed_annotation: ^3.1.0
  go_router: ^18.1.1
  image_picker: ^1.2.4
  intl: ^0.20.3
  json_annotation: ^4.12.0
  path: ^1.9.1
  path_provider: ^2.1.6
  permission_handler: ^13.0.2
  riverpod_annotation: ^4.0.7
  shared_preferences: ^2.5.6
  uuid: ^4.6.0

dev_dependencies:
  build_runner: ^2.16.2
  drift_dev: ^2.35.2
  flutter_test:
    sdk: flutter
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  mocktail: ^1.0.5
  riverpod_generator: ^4.0.9
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/data/
